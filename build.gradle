plugins {
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}

version = '1.1'
group = 'extravideoset'
archivesBaseName = 'extra_video_settings'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'

    copyIdeResources = true

    runs {
        client {
        }

        server {
        }

        configureEach {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            // Mixin refmap remapping: SRG -> official (dev環境でEmbeddiumのMixinを動作させる)
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${project.buildDir}/createSrgToMcp/output.srg"

            mods {
                extra_video_settings {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    maven {
        name = "Curse Maven"
        url = "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.3.0'
    // Embeddium 0.3.31 for 1.20.1
    compileOnly fg.deobf("curse.maven:embeddium-908741:5681725")
    runtimeOnly fg.deobf("curse.maven:embeddium-908741:5681725")
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Forge runClient のエイリアス
tasks.register('runClientfo') {
    group = 'application'
    description = 'Run Forge client (alias for runClient)'
    dependsOn 'runClient'
}

// Fabric runClient をルートから実行
tasks.register('runClientfa', Exec) {
    group = 'application'
    description = 'Run Fabric client'
    workingDir file('fabric')
    if (System.getProperty('os.name').toLowerCase().contains('windows')) {
        commandLine 'cmd', '/c', 'gradlew.bat', 'runClient'
    } else {
        commandLine './gradlew', 'runClient'
    }
}

// Forge build のエイリアス
tasks.register('buildfo') {
    group = 'build'
    description = 'Build Forge mod (alias for build)'
    dependsOn 'build'
}

// Fabric build をルートから実行
tasks.register('buildfa', Exec) {
    group = 'build'
    description = 'Build Fabric mod'
    workingDir file('fabric')
    if (System.getProperty('os.name').toLowerCase().contains('windows')) {
        commandLine 'cmd', '/c', 'gradlew.bat', 'build'
    } else {
        commandLine './gradlew', 'build'
    }
}
