plugins {
    id 'fabric-loom' version '1.5-SNAPSHOT'
}

version = '1.1'
group = 'extravideoset'

base {
    archivesName = "extra_video_settings-fabric-${project.minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

repositories {
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Sodium (required by Iris)
    modCompileOnly "maven.modrinth:sodium:mc1.20.4-0.5.8"
    modRuntimeOnly "maven.modrinth:sodium:mc1.20.4-0.5.8"

    // Iris Shaders
    modCompileOnly "maven.modrinth:iris:1.7.5+1.20.4"
    modRuntimeOnly "maven.modrinth:iris:1.7.5+1.20.4"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
