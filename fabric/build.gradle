plugins {
    id 'fabric-loom' version '1.7-SNAPSHOT'
}

version = '1.1'
group = 'extravideoset'

base {
    archivesName = "extra_video_settings-fabric-${project.minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

repositories {
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Sodium (required by the mixin) — 0.5.x が SodiumOptionsGUI API を提供
    modCompileOnly "maven.modrinth:sodium:${project.sodium_version}"
    modRuntimeOnly "maven.modrinth:sodium:${project.sodium_version}"

    // Iris Shaders (optional, recommended)
    modCompileOnly "maven.modrinth:iris:${project.iris_version}"
    modRuntimeOnly "maven.modrinth:iris:${project.iris_version}"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

// Share Java sources and resources from ../common/ (loader-agnostic code)
sourceSets {
    main {
        java.srcDir file('../common/src/main/java')
        resources.srcDir file('../common/src/main/resources')
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
