plugins {
    id 'fabric-loom' version '1.7-SNAPSHOT'
}

// Version is taken from -PevsVersion (set by buildfa.sh via scripts/next-version.sh).
version = project.findProperty('evsVersion') ?: '1.1'
group = 'extravideoset'

base {
    archivesName = "extra_video_settings-fabric-${project.minecraft_version}"
}

// Copy the Loom-remapped jar to repo-root dist/ as part of `build`.
// We pick remapJar specifically (skips intermediate -dev/-sources jars).
def evsDistDir = file("$rootDir/../dist")
tasks.named('build') {
    doLast {
        evsDistDir.mkdirs()
        def srcJar = tasks.named('remapJar').get().archiveFile.get().asFile
        def destJar = new File(evsDistDir, srcJar.name)
        if (srcJar.exists()) {
            destJar.bytes = srcJar.bytes
            logger.lifecycle "→ ${destJar}"
        }
    }
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

repositories {
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Sodium (required by the mixin) — 0.5.x が SodiumOptionsGUI API を提供
    modCompileOnly "maven.modrinth:sodium:${project.sodium_version}"
    modRuntimeOnly "maven.modrinth:sodium:${project.sodium_version}"

    // Iris Shaders (optional, recommended) — compile-only.
    // NOT added as runtime dep here because Iris 1.7.x for 1.20.1 hard-pins
    // Sodium 0.5.8 which doesn't exist for 1.20.1 (only 0.5.3 is the latest
    // Sodium for 1.20.1). End users pick a matching pair.
    modCompileOnly "maven.modrinth:iris:${project.iris_version}"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

// Share Java sources and resources from ../common/ (loader-agnostic code)
sourceSets {
    main {
        java.srcDir file('../common/src/main/java')
        resources.srcDir file('../common/src/main/resources')
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
