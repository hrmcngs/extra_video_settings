pluginManagement {
    repositories {
        maven { url = "https://maven.fabricmc.net/" }
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    // foojay-resolver 0.7.0 transitively pulls Gson 2.9.1, which breaks
    // fabric-loom's MinecraftMetadataProvider on JDK 17.0.5+
    // (cannot set final fields via reflection). 0.10.0+ updated Gson.
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'extra_video_settings-fabric'
