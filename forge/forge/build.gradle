plugins {
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}

// Version is taken from -PevsVersion (set by buildfo.sh via scripts/next-version.sh).
// Falls back to a hardcoded value when invoked directly with no project property.
version = project.findProperty('evsVersion') ?: '1.1'
group = 'extravideoset'
archivesBaseName = 'extra_video_settings-forge'

// Final reobf'd jar gets copied to the repo-root dist/ as part of `build`,
// so the shell scripts don't need a separate cp step.
def evsDistDir = file("$rootDir/../../dist")
tasks.named('build') {
    doLast {
        evsDistDir.mkdirs()
        def srcJar = jar.archiveFile.get().asFile
        def destJar = new File(evsDistDir, srcJar.name)
        if (srcJar.exists()) {
            destJar.bytes = srcJar.bytes
            logger.lifecycle "→ ${destJar}"
        }
    }
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'

    copyIdeResources = true

    runs {
        client {
        }

        server {
        }

        configureEach {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            // Mixin refmap remapping: SRG -> official (dev環境でEmbeddiumのMixinを動作させる)
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${project.buildDir}/createSrgToMcp/output.srg"

            // macOS Apple Silicon の Metal-OpenGL ブリッジが Forge の EARLYDISPLAY
            // で SIGSEGV を踏むので早期スプラッシュを無効化（dev runClient のみ）。
            property 'fml.earlyprogresswindow', 'false'

            mods {
                extra_video_settings {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    maven {
        name = "Curse Maven"
        url = "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.3.0'
    // Embeddium 0.3.31 for 1.20.1
    compileOnly fg.deobf("curse.maven:embeddium-908741:5681725")
    runtimeOnly fg.deobf("curse.maven:embeddium-908741:5681725")
}

// Share Java sources and resources from ../../common/ (loader-agnostic code)
sourceSets {
    main {
        java.srcDir file('../../common/src/main/java')
        resources.srcDir file('../../common/src/main/resources')
    }
}

processResources {
    // Substitute ${version} in mods.toml so the in-game mod-list version
    // matches whatever scripts/next-version.sh produced.
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') {
        expand 'version': project.version
    }
}

// Belt-and-suspenders: also register the mixin config via MANIFEST.MF.
// Forge 1.20.1 picks up [[mixins]] from mods.toml, but in dev runs the
// config sometimes isn't loaded (no debug log line). Adding MixinConfigs
// to the jar manifest ensures the mixin subsystem also sees it.
jar {
    manifest {
        attributes(
            'MixinConfigs': 'extra_video_settings.mixins.json'
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
