plugins {
    id 'eclipse'
    id 'net.neoforged.gradle.userdev' version '7.0.50'
}

// Version is taken from -PevsVersion (set by buildne.sh via scripts/next-version.sh).
version = project.findProperty('evsVersion') ?: '1.1'
group = 'extravideoset'

base {
    archivesName = 'extra_video_settings-neoforge'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        modSource project.sourceSets.main
    }
    client {
        workingDirectory project.file('run')
        // macOS Apple Silicon (M1/M2) + NeoForge 1.20.2 の EARLYDISPLAY が
        // Apple Metal-OpenGL bridge で SIGSEGV を踏むので早期スプラッシュを切る。
        // 本番ビルドには影響しない (dev runClient のみ)。
        systemProperty 'fml.earlyprogresswindow', 'false'
    }
    server {
        workingDirectory project.file('run')
    }
    data {
        workingDirectory project.file('run')
    }
}

repositories {
    maven {
        name = "Curse Maven"
        url = "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}

dependencies {
    // NeoForge for MC 1.20.2 (NeoForge does not support 1.20.1; 20.2.x is the
    // first NeoForge line, last 1.20.2 release is 20.2.93)
    implementation 'net.neoforged:neoforge:20.2.93'

    // Embeddium for 1.20.2: no published CurseForge artifact matches the
    // Forge 1.20.1 build we use; the EmbeddiumIntegration class is therefore
    // excluded from the NeoForge source set until a 1.20.2 artifact is wired up.
    //
    // Note: no Mixin annotation processor — NeoForge 1.20.2 uses Mojang
    // mappings at runtime, so the @Inject method names in PlayerInfoMixin
    // already match the live classes (no refmap remapping needed).
}

// Share Java sources and resources from ../../common/ (loader-agnostic code)
sourceSets {
    main {
        java.srcDir file('../../common/src/main/java')
        resources.srcDir file('../../common/src/main/resources')
        java {
            // Embeddium integration depends on a 1.20.1-only Embeddium API,
            // which we don't have a NeoForge 1.20.2 binary for. Skip it.
            exclude 'extravideoset/client/EmbeddiumIntegration.java'
        }
    }
}

processResources {
    // Substitute ${version} in mods.toml so the in-game mod-list version
    // matches whatever scripts/next-version.sh produced.
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
