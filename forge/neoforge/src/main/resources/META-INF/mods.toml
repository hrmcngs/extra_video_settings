modLoader="javafml"
# loaderVersion is the JAVAFML LANGUAGE PROVIDER version, NOT the NeoForge
# version. NeoForge 1.20.2 (20.2.x) ships javafml language 1.0.x.
# (The NeoForge runtime version itself is constrained below in dependencies.)
loaderVersion="[1,)"
license="MIT"

[[mixins]]
config="extra_video_settings.mixins.json"

[[mods]]
modId="extra_video_settings"
logoFile="icon.png"
version="${version}"
displayName="Extra Video Settings"
description='''Restores vanilla video settings (FOV Effects, Glint Speed, etc.) that Embeddium/Sodium remove. Save and load key bindings & video settings profiles.'''

[[dependencies.extra_video_settings]]
    modId="neoforge"
    mandatory=true
    versionRange="[20.2,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.extra_video_settings]]
    modId="minecraft"
    mandatory=true
    versionRange="[1.20.2,1.21)"
    ordering="NONE"
    side="BOTH"
